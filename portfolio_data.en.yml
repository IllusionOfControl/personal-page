now:
  title: "Now"
  description: "Since I don't actively participate in social media, this is my way of sharing and documenting publicly what I've been up to."
  last_updated: "Last updated August 2026."
  sections:
    - title: "Current focus"
      type: "focus"
      subsections:
        - title: "Day-to-day"
          items:
            - title: "Home Lab Development"
              desc: "Expanding and maintaining my self-hosted home lab (Proxmox, Docker, local microservices) to take full control of my data, infrastructure, and deployment environments for pet projects."
            - title: "Web Applications"
              desc: "Building personal web applications and scalable services featuring modern asynchronous backend architectures, performant APIs, and clean user interfaces."
        - title: "Personal development"
          items:
            - title: "Conversational English"
              desc: "Actively improving conversational and professional English to share knowledge, expand networking opportunities, and collaborate seamlessly within the international engineering community."

    - title: "Learning"
      type: "learning"
      subsections:
        - title: "Languages & Frameworks"
          items:
            - title: "Rust & Go Ecosystem"
              desc: "Diving deeper into Rust and Go to build high-performance microservices, distributed systems, and efficient system tooling with a strong focus on concurrency, memory safety, and raw speed."
            - title: "AI Agents & Machine Learning"
              desc: "Exploring autonomous AI agent architectures (LangChain, LangGraph, Ollama, Qdrant), integrating local/cloud LLMs, and implementing practical ML/ETL pipelines to automate complex workflows."

    - title: "Open Source & GitHub"
      type: "github"
      subsections:
        - title: "Public Projects & Repositories"
          items:
            - title: "Active Open Source Development"
              desc: "Regularly publishing side projects, Telegram bots, tools, and architectural boilerplates on GitHub. Maintaining clean code and giving back to the developer community."
            - title: "Exploration & Best Practices"
              desc: "Benchmarking emerging frameworks, testing modern backend libraries, and applying industry best practices to design resilient distributed systems."

    - title: "Gaming & Hobbies"
      type: "playing"
      subsections:
        - title: "Currently playing"
          items:
            - title: "Assetto Corsa Competizione"
              desc: "Passionate about sim racing — a fantastic way to train focus, precision timing, composure under pressure, and experience authentic motorsport vehicle dynamics."
            - title: "Factorio"
              desc: "Designing and optimizing complex automated production chains and logistics networks. The ultimate playground for engineering and systems thinking."
            - title: "Minecraft"
              desc: "A creative sandbox for building, exploring redstone logic, complex contraptions, and automated farm mechanics."
            - title: "Dota 2"
              desc: "Competitive team play, tactical decision-making, fast micro-control, and real-time coordination in dynamic matches."

