now:
  title: "Сейчас"
  description: "Поскольку я не веду социальные сети активно, это мой способ делиться тем, над чем я сейчас работаю."
  last_updated: "Обновлено в августе 2026."
  sections:
    - title: "Текущий фокус"
      type: "focus"
      subsections:
        - title: "Повседневная работа"
          items:
            - title: "Home Lab Development"
              desc: "Занимаюсь развитием домашней лаборатории (Proxmox, Docker, self-hosted сервисы), чтобы полностью контролировать свои данные, окружение и инфраструктуру пет-проектов."
            - title: "Web Applications"
              desc: "Разработка личных веб-приложений и масштабируемых сервисов с современным асинхронным бэкендом и удобным интерфейсом."
        - title: "Личное развитие"
          items:
            - title: "Conversational English"
              desc: "Изучение разговорного английского языка. Активно улучшаю разговорный английский, чтобы расширить возможности делиться опытом, вести нетворкинг и свободно общаться в международном комьюнити."

    - title: "Обучение"
      type: "learning"
      subsections:
        - title: "Языки и фреймворки"
          items:
            - title: "Экосистема Rust и Go"
              desc: "Углубление в Rust и Go для создания высоконагруженных микросервисов, распределенных систем и эффективных системных утилит с максимальной производительностью и параллелизмом."
            - title: "AI-агенты и Machine Learning"
              desc: "Исследование архитектур автономных AI-агентов (LangChain, LangGraph, Ollama, Qdrant), интеграция локальных LLM и практические ML-пайплайны для автоматизации сложных бизнес-процессов."

    - title: "Open Source и GitHub"
      type: "github"
      subsections:
        - title: "Публичные проекты и репозитории"
          items:
            - title: "Активная Open Source разработка"
              desc: "Регулярно выкладываю проекты, ботов и эксперименты на GitHub. Поддерживаю чистую архитектуру и делюсь кодом с сообществом разработчиков."
            - title: "Эксперименты и Best Practices"
              desc: "Тестирую новые фреймворки, бенчмаркаю библиотеки и применяю современные практики построения надежных сервисов."

    - title: "Игры и хобби"
      type: "playing"
      subsections:
        - title: "Во что играю"
          items:
            - title: "Assetto Corsa Competizione"
              desc: "Обожаю симрейсинг — отличный способ отточить концентрацию, тайминги, хладнокровие и почувствовать поведение спортивного автомобиля на реальных треках."
            - title: "Factorio"
              desc: "Проектирование и оптимизация сложных автоматизированных производственных конвейеров. Идеальный тренажер для инженерного и системного мышления."
            - title: "Minecraft"
              desc: "Уютный мир для креатива, экспериментов с редстоуном, сложными механизмами и автоматизацией ферм."
            - title: "Dota 2"
              desc: "Соревновательный командный дух, тактика, микроконтроль и быстрая реакция в динамичных матчах."

