hero:
  name: Сергей Скороход
  role: "Python Backend Developer (Middle+/Senior) | Full Stack Developer"
  description: |
    Python бэкенд-разработчик, специализирующийся на создании быстрых и масштабируемых асинхронных приложений на FastAPI.
    Опыт в разработке AI/LLM-решений, ETL-пайплайнов на Apache Airflow, высоконагруженных микросервисов и интеграций с CRM и платежными системами.
  cv_url: "https://drive.google.com/file/d/17oqcjAg94V_Kgj7geIr3CN2pF_QDLGsr/view?usp=share_link"

about:
  paragraphs:
    - "Python Backend разработчик, сфокусированный на проектировании быстрых и масштабируемых асинхронных сервисов на FastAPI. Создавал игровые API, интеграции и AI-решения для автоматизации бизнес-процессов."
    - "Имею опыт проектирования архитектур на Event Sourcing, работы с векторными базами данных (Qdrant), LLM фреймворками (LangChain, Ollama) и построения сложных ETL-пайплайнов на Apache Airflow."
    - "🎓 Высшее образование: БГУИР, Факультет компьютерных систем и сетей, специальность «Программное обеспечение информационных технологий»."

